<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Primary Gradient -->
    <linearGradient id="textraPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textraCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Rounded Shield / Rounded Squircle Frame -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="#0b0f19" stroke="url(#textraPrimary)" stroke-width="4" filter="url(#cardShadow)"/>
  
  <!-- Neural Network Interconnecting Graph Lines (representing Syntax Tree / Universal Dependencies) -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="2.5" stroke-dasharray="6,6">
    <line x1="160" y1="150" x2="256" y2="150"/>
    <line x1="352" y1="150" x2="256" y2="150"/>
    <line x1="256" y1="150" x2="256" y2="360"/>
    <line x1="160" y1="150" x2="256" y2="256"/>
    <line x1="352" y1="150" x2="256" y2="256"/>
  </g>

  <!-- Arc Dependency Curve (Linguistic Arcs) -->
  <path d="M 160 150 Q 256 70 352 150" fill="none" stroke="url(#textraCyan)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Futuristic Geometric 'T' & Neural Crossbar -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Crossbar of T -->
    <path d="M 120 150 L 392 150 C 404 150 412 160 408 172 L 394 200 C 390 208 382 214 372 214 L 140 214 C 130 214 122 208 118 200 L 104 172 C 100 160 108 150 120 150 Z" 
          fill="url(#textraPrimary)"/>

    <!-- Central Vertical Stem of T -->
    <path d="M 228 200 L 284 200 C 292 200 298 206 298 214 L 298 376 C 298 388 288 398 276 398 L 236 398 C 224 398 214 388 214 376 L 214 214 C 214 206 220 200 228 200 Z" 
          fill="url(#textraPrimary)"/>

    <!-- Dynamic Right Forward Wing (Signifying NLP Generation & Speed) -->
    <polygon points="310,240 376,240 346,280 290,280" fill="url(#textraCyan)" opacity="0.9"/>
  </g>

  <!-- Neural Nodes (CoreNLP Tokens / Entity Nodes) -->
  <circle cx="160" cy="150" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  <circle cx="352" cy="150" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="3"/>
  <circle cx="256" cy="150" r="12" fill="#a855f7" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="8" fill="#34d399" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="256" cy="380" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="3"/>

  <!-- Sparkling Intelligence Star -->
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
